<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>grid test</title>
<link rel="stylesheet" href="/assets/app.css">
<style>#host{height:300px;width:600px;border:1px solid #ccc}</style>
</head><body>
<div id="host"></div>
<pre id="out">RUNNING</pre>
<script type="module">
import { createGrid } from '/assets/js/grid.js';
const L = [];
const ok = (name, cond) => L.push((cond ? 'PASS ' : 'FAIL ') + name);

const host = document.getElementById('host');
const sorts = [];
const checks = [];
const g = createGrid(host, {
  checkable: true,
  onSort: (k) => sorts.push(k),
  onCheckChange: (n) => checks.push(n),
});
const cols = [{ name: 'id', type: 'INT32' }, { name: 'name', type: 'VARCHAR' }, { name: 'score', type: 'DOUBLE' }];
const rows = [
  [1, 'Alice', 88.5],
  [2, 'Bob', null],
  [3, 'A-very-long-name-value-here', 77.25],
];
g.setData(cols, rows);

// 列宽读取（checkable + rownum 占前两列）
const colEl = (ci) => host.querySelectorAll('colgroup col')[2 + ci];
const wOf = (ci) => parseInt(colEl(ci).style.width, 10);

// ① 结构
ok('colgroup/固定布局', !!host.querySelector('colgroup') && host.querySelector('table').style.tableLayout === 'fixed');
ok('列头 3 个 + 列宽手柄 4 个（含行号列）',
  host.querySelectorAll('th[data-col]').length === 3 && host.querySelectorAll('th .resize').length === 4 &&
  host.querySelectorAll('th .rowresize').length === 1);
ok('复选框/行号列', host.querySelectorAll('td.ck input[data-ck]').length === 3 && host.querySelectorAll('td.rownum').length === 3);
ok('NULL 灰斜体', !!host.querySelector('td.nullv'));
ok('初始列宽 id=' + wOf(0) + ' name=' + wOf(1) + ' score=' + wOf(2), wOf(1) > 52 && wOf(2) > 52);

// ② 三态排序
const th = host.querySelector('th[data-col="score"]');
for (let i = 0; i < 3; i++) th.dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('三态排序 asc/desc/null', JSON.stringify(sorts) === JSON.stringify([{ col: 'score', dir: 'asc' }, { col: 'score', dir: 'desc' }, null]));

// ③ 列宽拖拽（name 列 +60px）
const w0 = wOf(1);
host.querySelector('th[data-col="name"] .resize').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 200 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 260 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('拖拽列宽 ' + w0 + ' → ' + wOf(1), wOf(1) === w0 + 60);
ok('其它列不动', wOf(0) === 52 || wOf(0) > 0);

// ④ 双击自适应（先手动拖宽 score，再双击应收回贴合内容的宽度）
host.querySelector('th[data-col="score"] .resize').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 300 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 420 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
const wide = wOf(2);
host.querySelector('th[data-col="score"] .resize').dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
ok('双击自适应 score ' + wide + ' → ' + wOf(2), wide > 100 && wOf(2) < wide && wOf(2) >= 52);

// ⑤ 全选复选框
const all = host.querySelector('input[data-ck-all]');
all.checked = true;
all.dispatchEvent(new Event('change', { bubbles: true }));
ok('全选 → getChecked=[0,1,2]', JSON.stringify(g.getChecked()) === JSON.stringify([0, 1, 2]));
ok('onCheckChange(3)', checks[checks.length - 1] === 3);

// ⑥ 单元格区块选择 + 复制
g.clearChecked();
host.querySelector('tr[data-r="0"] td[data-c="0"]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
host.querySelector('tr[data-r="1"] td[data-c="1"]').dispatchEvent(new MouseEvent('mousemove', { bubbles: true, buttons: 1 }));
ok('区块选中 4 格', host.querySelectorAll('td[data-c].sel').length === 4);
const dt = new DataTransfer();
document.dispatchEvent(new ClipboardEvent('copy', { clipboardData: dt, bubbles: true }));
ok('Ctrl+C TSV = ' + JSON.stringify(dt.getData('text/plain')), dt.getData('text/plain') === '1\tAlice\n2\tBob');

// ⑦ 点行号选整行 → Ctrl+A 全选（只数数据格）
host.querySelector('tr[data-r="2"] td.rownum').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
ok('点行号选整行 3 格（行号格也高亮）', host.querySelectorAll('td[data-c].sel').length === 3 && !!host.querySelector('td.rownum.sel'));
host.dispatchEvent(new KeyboardEvent('keydown', { key: 'a', ctrlKey: true, bubbles: true }));
ok('Ctrl+A 全选 9 格', host.querySelectorAll('td[data-c].sel').length === 9);

// ⑧ 无 onSort（查询结果）→ 本地排序
const host2 = document.createElement('div');
host2.style.cssText = 'height:200px;width:400px';
document.body.appendChild(host2);
const g2 = createGrid(host2);
g2.setData(cols, rows.slice());
host2.querySelector('th[data-col="name"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('查询结果本地升序首行 = ' + g2.rowAt(0)[1], g2.rowAt(0)[1] === 'A-very-long-name-value-here');
host2.querySelector('th[data-col="name"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('再点降序首行 = ' + g2.rowAt(0)[1], g2.rowAt(0)[1] === 'Bob');
ok('排序后 rowAt 仍是完整数据行', g2.rowAt(0).length === 3 && g2.rowAt(0)[0] === 2);

// ⑨ 大表虚拟滚动的垫片高度随行高变化（行高可拖）
const host3 = document.createElement('div');
host3.style.cssText = 'height:300px;width:600px;border:1px solid #ccc';
document.body.appendChild(host3);
const big = Array.from({ length: 500 }, (_, i) => [i + 1, 'name-' + i, i * 1.5]);
const g3 = createGrid(host3);
g3.setData(cols, big);
host3.scrollTop = 4000;
host3.dispatchEvent(new Event('scroll', { bubbles: true }));
const padOf = () => host3.querySelector('tr.pad td');
const padH = () => (padOf() ? parseInt(padOf().style.height, 10) : 0);
ok('大表出现垫片，高度是行高整数倍（' + padH() + ' % 26）', !!padOf() && padH() > 0 && padH() % 26 === 0);
host3.querySelector('th.rownum .rowresize').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 0, clientY: 0 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 0, clientY: 14, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('拖行高后 rowHeight() = ' + g3.rowHeight(), g3.rowHeight() === 40);
ok('垫片按新行高重算（' + padH() + ' % 40）', padH() % 40 === 0 && padH() > 0);
const rowPx = host3.querySelector('tr[data-r]').offsetHeight;
ok('实测行高 ' + rowPx + 'px ≈ 40', Math.abs(rowPx - 40) <= 1);
ok('行高已写入 CSS 变量', host3.querySelector('table').style.getPropertyValue('--row-h') === '40px');
g3.resetLayout();
ok('resetLayout 复位行高 26', g3.rowHeight() === 26);

// ⑩ 回归：拖列宽/行高后浏览器补发的 click，不能当成「点列头排序」或「点 # 全选」
const sortsBefore = sorts.length;
const scoreW0 = wOf(2);
host.querySelector('th[data-col="score"] .resize').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 100, clientY: 0 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 130, clientY: 0, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
host.querySelector('th[data-col="score"]').dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('拖列宽后的尾随 click 不触发排序（sorts=' + sorts.length + '）', sorts.length === sortsBefore);
ok('拖列宽后的尾随 click 不清掉列宽 ' + colEl(2).style.width, wOf(2) === scoreW0 + 30);
g.clearSelection();
host.querySelector('th.rownum .rowresize').dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: 0, clientY: 0 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: 0, clientY: 10, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
host.querySelector('th.rownum').dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('拖行高后的尾随 click 不触发全选', host.querySelectorAll('td[data-c].sel').length === 0);
ok('行高保持拖后的值 ' + g.rowHeight(), g.rowHeight() === 36);

// ⑪ setData（翻页 / 排序 / 保存 / 重跑查询都会走这里）保留手动列宽
const wName = colEl(1).style.width;
g.setData(cols, rows);
ok('setData 后手动列宽保留（' + wName + ' → ' + colEl(1).style.width + '）', colEl(1).style.width === wName);
g.setData([{ name: 'other', type: 'INT' }], [[1]]);
ok('换成别的列则重新自适应', colEl(0).style.width !== wName);
g.setData(cols, rows);
ok('换回来仍能按列名找回宽度 ' + colEl(1).style.width, colEl(1).style.width === wName);

// ⑫ 回归：mousedown 选区只改类名、不重建表格 DOM。
// 整表重建会让第二次点击落在新的 td 实例上，浏览器 dblclick 计数（detail）到不了 2，
// 双击进入单元格编辑就永远不触发（真实浏览器才有的问题，直接派发 dblclick 测不出来）。
g.clearSelection();
const td0 = host.querySelector('tr[data-r="0"] td[data-c="0"]');
td0.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
ok('mousedown 高亮选区', td0.classList.contains('sel'));
ok('mousedown 不重建表格 DOM（元素身份不变）',
  td0.isConnected && host.querySelector('tr[data-r="0"] td[data-c="0"]') === td0);
// 完整两次点击序列后，dblclick 仍派发到同一个 td 上且能冒泡到容器
td0.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
td0.dispatchEvent(new MouseEvent('click', { bubbles: true }));
td0.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
td0.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
td0.dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('两次点击后 td 实例仍未替换', host.querySelector('tr[data-r="0"] td[data-c="0"]') === td0);
let dblSeen = false;
host.addEventListener('dblclick', () => { dblSeen = true; }, { once: true });
td0.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
ok('dblclick 冒泡到容器（编辑入口可达）', dblSeen);

// ⑬ 脏标记（暂存编辑）：dirtyFn 返回 kind（dirty/deleted/inserted），c=-1 表示整行
g.setData(cols, rows, (r, c) => (r === 1 && (c === -1 || c === 1) ? 'dirty' : null));
ok('暂存格有 dirty 类', !!host.querySelector('tr[data-r="1"] td[data-c="1"].dirty'));
ok('行号格有 dirty 类（左缘色条）', !!host.querySelector('tr[data-r="1"] td.rownum.dirty'));
ok('未修改列无标记', !host.querySelector('tr[data-r="1"] td[data-c="0"].dirty'));
g.setData(cols, rows, (r) => (r === 0 ? 'deleted' : null));
ok('删除行样式（划线）', !!host.querySelector('tr[data-r="0"] td[data-c="1"].deleted'));
g.setData(cols, rows, (r) => (r === 2 ? 'inserted' : null));
ok('新增行样式', !!host.querySelector('tr[data-r="2"] td[data-c="0"].inserted'));
g.setData(cols, rows);
ok('清除后无标记', !host.querySelector('.grid .dirty, .grid .deleted, .grid .inserted'));

// ⑭ 任意单元格交界可拖拽（Excel 式）：右缘 = 列宽，下缘 = 行高，行号格右缘 = 行号列宽
g.clearSelection();
const nearRect = (el, side, back = 2) => {
  const r = el.getBoundingClientRect();
  return side === 'r' ? { x: r.right - back, y: r.top + 3 } : { x: r.left + 5, y: r.bottom - back };
};
const tdA = host.querySelector('tr[data-r="0"] td[data-c="0"]');
// 光标提示
tdA.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(tdA, 'r').x, clientY: nearRect(tdA, 'r').y }));
ok('悬停单元格右缘出现 col-resize 光标', host.querySelector('table').style.cursor === 'col-resize');
tdA.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(tdA, 'r').x, clientY: nearRect(tdA, 'r').y }));
ok('悬停交界出现高亮（edge-r）', !!host.querySelector('td.edge-r') && !host.querySelector('td.edge-b'));
const ra = tdA.getBoundingClientRect();
tdA.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: ra.left + ra.width / 2, clientY: ra.top + 3 }));
ok('离开交界光标恢复且高亮消失（cursor=' + JSON.stringify(host.querySelector('table').style.cursor) + '）',
  host.querySelector('table').style.cursor === '' && !host.querySelector('td.edge-r'));
// 右缘拖列宽：只改 colgroup、不重建 DOM、不产生选区
const wa0 = wOf(0);
tdA.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: nearRect(tdA, 'r').x, clientY: nearRect(tdA, 'r').y, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(tdA, 'r').x + 45, clientY: nearRect(tdA, 'r').y, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('单元格右缘拖列宽 ' + wa0 + ' → ' + wOf(0), wOf(0) === wa0 + 45);
// 左缘 = 上一列的右边界（等效命中带加倍）
const wb0 = wOf(0);
const tdB0 = host.querySelector('tr[data-r="0"] td[data-c="1"]');
const lb = tdB0.getBoundingClientRect();
tdB0.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: lb.left + 2, clientY: lb.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: lb.left + 2 + 20, clientY: lb.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('下一列左缘拖同一交界 ' + wb0 + ' → ' + wOf(0), wOf(0) === wb0 + 20);
// 首数据列左缘 = 行号列右边界
const rnColL = host.querySelectorAll('colgroup col')[1];
const rn0L = parseInt(rnColL.style.width, 10);
const tdC0 = host.querySelector('tr[data-r="0"] td[data-c="0"]');
const lc = tdC0.getBoundingClientRect();
tdC0.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: lc.left + 2, clientY: lc.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: lc.left + 2 - 12, clientY: lc.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('首数据列左缘拖行号列宽 ' + rn0L + ' → ' + parseInt(rnColL.style.width, 10), parseInt(rnColL.style.width, 10) === rn0L - 12);
ok('交界拖拽不重建 DOM（td 实例不变）', host.querySelector('tr[data-r="0"] td[data-c="0"]') === tdA);
ok('交界拖拽不产生选区', !host.querySelector('td.sel'));
tdA.dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('交界拖拽的尾随 click 无副作用（仍无选区）', !host.querySelector('td.sel'));
// 下缘拖行高（⑩ 后行高 = 36）
const rh0 = g.rowHeight();
const tdB = host.querySelector('tr[data-r="1"] td[data-c="1"]');
tdB.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(tdB, 'b').x, clientY: nearRect(tdB, 'b').y }));
ok('悬停单元格下缘出现 row-resize 光标', host.querySelector('table').style.cursor === 'row-resize');
tdB.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: nearRect(tdB, 'b').x, clientY: nearRect(tdB, 'b').y, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(tdB, 'b').x, clientY: nearRect(tdB, 'b').y + 8, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('单元格下缘拖行高 ' + rh0 + ' → ' + g.rowHeight(), g.rowHeight() === rh0 + 8);
// 行号格右缘 = 行号列宽
const rnTd = host.querySelector('tr[data-r="0"] td.rownum');
const rnCol = host.querySelectorAll('colgroup col')[1];
const rn0 = parseInt(rnCol.style.width, 10);
rnTd.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: nearRect(rnTd, 'r').x, clientY: nearRect(rnTd, 'r').y, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: nearRect(rnTd, 'r').x + 10, clientY: nearRect(rnTd, 'r').y, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
ok('行号格右缘拖行号列宽 ' + rn0 + ' → ' + parseInt(rnCol.style.width, 10), parseInt(rnCol.style.width, 10) === rn0 + 10);
// 交界拖拽后双击仍能进编辑（dblclick 冒泡不被拖拽路径吞掉）。
// 注意：行高拖拽会 render() 重建 DOM，须重新取节点（列宽拖拽只改 colgroup，不重建）。
let dblCell = false;
host.addEventListener('dblclick', () => { dblCell = true; }, { once: true });
const tdA2 = host.querySelector('tr[data-r="0"] td[data-c="0"]');
ok('行高拖拽后仍是同一网格内容（新 td 已就位）', !!tdA2 && tdA2 !== tdA);
tdA2.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
ok('交界处双击仍冒泡（编辑入口可达）', dblCell);
g.resetLayout();

// ⑮ 隐藏列（数据浏览的 rowid）：定位键参与数据/索引体系，但不展示、不进复制
const colsH = [{ name: 'rowid', type: 'INT64' }, { name: 'id', type: 'INT32' }, { name: 'v', type: 'VARCHAR' }];
const rowsH = [[196608, 1, 'a'], [196609, 2, 'b']];
g.setData(colsH, rowsH, null, { hidden: ['rowid'] });
ok('隐藏列不出 colgroup/表头/单元格',
  host.querySelectorAll('colgroup col').length === 5 &&          // ck + rownum + 2 可见数据列 + 填充列
  !host.querySelector('th[data-col="rowid"]') && !host.querySelector('td[data-c="0"]'));
ok('其余列 data-c 仍是数据索引（v = data-c 2）',
  !!host.querySelector('td[data-c="2"]') && host.querySelector('tr[data-r="0"] td[data-c="2"]').textContent === 'a');
g.clearSelection();
host.querySelector('tr[data-r="0"] td[data-c="2"]').dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
host.querySelector('tr[data-r="1"] td[data-c="2"]').dispatchEvent(new MouseEvent('mousemove', { bubbles: true, buttons: 1 }));
const dtH = new DataTransfer();
document.dispatchEvent(new ClipboardEvent('copy', { clipboardData: dtH, bubbles: true }));
ok('复制不含隐藏列（' + JSON.stringify(dtH.getData('text/plain')) + '）', dtH.getData('text/plain') === 'a\nb');
host.dispatchEvent(new KeyboardEvent('keydown', { key: 'a', ctrlKey: true, bubbles: true }));
ok('Ctrl+A 只选中可见格（4 格）', host.querySelectorAll('td[data-c].sel').length === 4);
g.setData(colsH, rowsH, (r, c) => (r === 1 && c === 2 ? 'dirty' : null), { hidden: ['rowid'] });
ok('脏标记按数据索引命中隐藏列之外的列', !!host.querySelector('td[data-c="2"].dirty'));
g.setData(cols, rows);
ok('不带 hidden 恢复完整展示（id 列回来到 data-c 0）',
  !!host.querySelector('th[data-col="id"]') && host.querySelectorAll('td[data-c="0"]').length === 3);

// ⑯ 填充列：真实列宽恒等于 colgroup 设定值（表格不再被拉伸），
//    否则列边界与设定值脱节 → 拖边界对不上、# 列缩不下去
g.setData(cols, rows);
const gridwrapEl = host;
const cgSum = () => [...host.querySelectorAll('colgroup col')].slice(0, -1)
  .reduce((a, c) => a + parseFloat(c.style.width || 0), 0);
const fillerCol = () => host.querySelector('colgroup col.filler');
ok('存在填充列', !!fillerCol());
ok('表宽 = 真实列宽之和 + 填充（' + Math.round(parseFloat(host.querySelector('table').style.width)) + 'px）',
  Math.abs(parseFloat(host.querySelector('table').style.width) - (cgSum() + parseFloat(fillerCol().style.width))) < 1);
ok('填充列让表宽铺满容器（' + gridwrapEl.clientWidth + 'px）',
  Math.abs(parseFloat(host.querySelector('table').style.width) - gridwrapEl.clientWidth) < 2);
// 每列实际 td 宽 == colgroup 设定宽（这是拖拽 1:1 跟手的前提）
const widthsOk = [...host.querySelectorAll('tbody tr[data-r="0"] td')].every((td, i) => {
  const col = host.querySelectorAll('colgroup col')[i];
  const set = parseFloat(col.style.width || 0);
  return set === 0 || Math.abs(td.getBoundingClientRect().width - set) <= 1;
});
ok('实际 td 宽 == colgroup 设定宽（无拉伸）', widthsOk);
// 填充列表头不可排序
const sortsBefore2 = sorts.length;
host.querySelector('th.filler').dispatchEvent(new MouseEvent('click', { bubbles: true }));
ok('点填充列表头不排序', sorts.length === sortsBefore2);
// # 列左缘（与复选框列的交界）也能拖：把 # 列往左缩到最小
g.resetLayout();
const rnColEl = host.querySelectorAll('colgroup col')[1];
const rnBefore = parseFloat(rnColEl.style.width);
let rnTdL = host.querySelector('tr[data-r="0"] td.rownum');
let rl = rnTdL.getBoundingClientRect();
rnTdL.dispatchEvent(new MouseEvent('mousedown', { bubbles: true, clientX: rl.left + 3, clientY: rl.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: rl.left + 3 - 40, clientY: rl.top + 3, buttons: 1 }));
document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
rnTdL = host.querySelector('tr[data-r="0"] td.rownum');
ok('# 列左缘可拖：' + rnBefore + ' → ' + parseFloat(rnColEl.style.width) +
   '（视觉 ' + Math.round(rnTdL.getBoundingClientRect().width) + '）',
  parseFloat(rnColEl.style.width) < rnBefore &&
  Math.abs(rnTdL.getBoundingClientRect().width - parseFloat(rnColEl.style.width)) <= 1);

document.getElementById('out').textContent = L.join('\n');
