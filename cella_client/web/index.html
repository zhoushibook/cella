<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cella</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <h1 class="sr-only">cella 数据库图形客户端</h1>

  <header id="topbar" class="topbar">
    <span class="brand">cella</span>
    <span id="dbSelect" class="dbselect" title="切换数据库"></span>
    <span class="spacer"></span>
    <button id="btnRun" class="btn primary" title="执行 (Ctrl+Enter)">▶ 执行</button>
    <button id="btnFormat" class="btn" title="格式化 SQL">格式化</button>
    <select id="sqlHistory" class="histsel" title="SQL 历史（Ctrl+↑ / Ctrl+↓ 回翻）" disabled><option value="">历史…</option></select>
    <button id="btnExport" class="btn" title="导出当前结果（右键=JSON）">导出</button>
    <span class="spacer"></span>
    <span id="userChip" class="userchip" title="当前登录用户"></span>
    <button id="btnLogout" class="btn" style="display:none" title="登出">登出</button>
    <span id="txnBadge" class="txnbadge" title="事务状态">事务空闲</span>
    <button id="btnBegin" class="btn">BEGIN</button>
    <button id="btnCommit" class="btn" disabled>COMMIT</button>
    <button id="btnRollback" class="btn" disabled>ROLLBACK</button>
    <button id="btnTheme" class="btn icon" title="切换主题">◐</button>
  </header>

  <div id="busyBar" class="busybar hidden"></div>
  <div id="connBanner" class="connbanner">
    <span>⚠ 与服务的连接已断开</span>
    <span class="hint" id="connHint">服务进程可能已停止。恢复后会自动重连。</span>
    <button id="connRetry" class="btn">立即重试</button>
  </div>

  <div id="main" class="main">
    <aside id="sidebar" class="sidebar">
      <div class="sidebarhead">
        <input id="treeFilter" class="filterbox" type="text" placeholder="筛选表…" spellcheck="false">
        <button id="btnRefresh" class="btn icon" title="刷新目录">⟳</button>
      </div>
      <div id="tree" class="tree"></div>
      <div class="sidebartip">右键表名：打开数据 / 查看结构 / 新建查询 / 删除表<br>拖右边缘调整宽度</div>
    </aside>
    <div id="sidebarSplit" class="splitter v" title="拖动调整侧边栏宽度（双击复位）"></div>

    <section id="content" class="content">
      <div id="tabbar" class="tabbar"></div>
      <div id="tabbody" class="tabbody"></div>
    </section>
  </div>

  <footer id="statusbar" class="statusbar">
    <span id="stLeft" class="stleft"></span>
    <span class="spacer"></span>
    <span id="stBusy" class="stbusy hidden">执行中…</span>
    <span id="stMsgs" class="stlink">消息</span>
    <span id="stPlan" class="stlink">计划</span>
    <span id="stDiag" class="stlink">诊断</span>
  </footer>

  <div id="panelSplit" class="splitter h hidden" title="拖动调整底部面板高度（双击复位）"></div>
  <div id="bottomPanel" class="bottompanel hidden">
    <div class="bottomhead">
      <span id="bpTitle" class="bptitle"></span>
      <span class="spacer"></span>
      <button id="bpClose" class="btn icon" title="关闭">✕</button>
    </div>
    <div id="bpBody" class="bottombody"></div>
  </div>

  <div id="loginOverlay" class="loginoverlay">
    <div class="loginbox">
      <div class="logintitle">cella 登录</div>
      <label class="loginrow">用户名<input id="loginUser" type="text" autocomplete="username" spellcheck="false"></label>
      <label class="loginrow">口令<input id="loginPass" type="password" autocomplete="current-password"></label>
      <div id="loginErr" class="loginerr"></div>
      <button id="btnLogin" class="btn primary">登录</button>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script>
    // 启动错误显性化：模块加载失败/运行时异常直接显示在页面上（而不是静默空白）
    window.addEventListener('error', (e) => {
      const d = document.getElementById('bootError');
      if (d) {
        d.style.display = 'block';
        d.textContent = '启动失败: ' + (e.message || '未知错误') +
          (e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : '');
      }
    });
    window.addEventListener('unhandledrejection', (e) => {
      const d = document.getElementById('bootError');
      if (d) {
        d.style.display = 'block';
        d.textContent = '启动失败: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
      }
    });
  </script>
  <div id="bootError" style="display:none; margin:16px; padding:12px; border:1px solid #dc2626; border-radius:6px; color:#dc2626; font-family:monospace; white-space:pre-wrap"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
